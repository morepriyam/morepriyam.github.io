<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Pulse link test host</title>
  <style>
    :root { --bg: #0b0b0f; --text: #f2f2f5; --dim: #a3a3b2; --accent: #ff453a; }
    @media (prefers-color-scheme: light) { :root { --bg: #f6f6f8; --text: #111116; --dim: #5d5d6b; } }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); max-width: 560px; margin: 0 auto; padding: 32px 16px; line-height: 1.5; }
    p { color: var(--dim); margin: 12px 0; }
    a { color: var(--accent); overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <h1>Pulse link test host</h1>
  <p>Testing Universal Links / App Links for <a href="https://github.com/mieweb/pulse/issues/252">mieweb/pulse#252</a>. Not used by any shipped build.</p>
  <p>Sample pairing link (fake artifact, parses but won't pair):</p>
  <p><a href="/pulse/open#v=1&artifactId=00000000-0000-4000-8000-000000000000&server=https%3A%2F%2Fpulsevault.os.mieweb.org&token=test">/pulse/open#v=1&amp;artifactId=…&amp;server=https://pulsevault.os.mieweb.org&amp;token=test</a></p>
</body>
</html>
