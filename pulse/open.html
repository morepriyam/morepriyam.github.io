<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex">
  <title>Open in Pulse</title>
  <link rel="icon" href="assets/icon.png">
  <style>
    :root {
      --bg: #0b0b0f;
      --card: #16161d;
      --border: #2a2a35;
      --text: #f2f2f5;
      --dim: #a3a3b2;
      --accent: #ff453a;
    }
    @media (prefers-color-scheme: light) {
      :root { --bg: #f6f6f8; --card: #ffffff; --border: #e2e2e8; --text: #111116; --dim: #5d5d6b; }
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }
    main { width: 100%; max-width: 380px; text-align: center; }
    .icon { width: 88px; height: 88px; border-radius: 20px; margin-bottom: 20px; }
    h1 { font-size: 26px; font-weight: 700; margin-bottom: 8px; }
    p { color: var(--dim); font-size: 16px; line-height: 1.45; }
    .actions { display: flex; flex-direction: column; align-items: center; gap: 14px; margin-top: 28px; }
    .button {
      display: block; width: 100%; padding: 15px 20px; border: 0; border-radius: 14px;
      background: var(--accent); color: #fff; font: inherit; font-size: 17px; font-weight: 600;
      text-decoration: none; cursor: pointer;
    }
    .link { color: var(--accent); font-size: 16px; font-weight: 600; text-decoration: none; }
    .badge img { height: 52px; display: block; }
    .qr { background: #fff; padding: 12px; border-radius: 12px; display: inline-block; margin-top: 24px; }
    .qr img { display: block; width: 200px; height: 200px; image-rendering: pixelated; }
    .note { font-size: 14px; margin-top: 18px; }
    .debug {
      margin-top: 36px; padding: 12px 14px; border: 1px dashed var(--border); border-radius: 12px;
      text-align: left; font: 12px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--dim);
      overflow-wrap: anywhere;
    }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <img class="icon" src="assets/icon.png" alt="Pulse">
    <h1 id="title">Open in Pulse</h1>
    <p id="lead">Pulse records and uploads short videos.</p>

    <!-- Android: we send the person to Play automatically; the badge is the one-tap fallback. -->
    <div class="actions" id="android" hidden>
      <a class="badge" id="play-badge" href="#"><img src="assets/badge-google-play.png" alt="Get it on Google Play"></a>
      <a class="link" id="android-open" href="#">Already have Pulse? Open it</a>
    </div>

    <!-- iOS: one tap, because Safari only lets a page copy the link during a tap. -->
    <div class="actions" id="ios" hidden>
      <button class="button" id="get-pulse" type="button">Get Pulse</button>
      <a class="link" id="ios-open" href="#">Already have Pulse? Open it</a>
      <p class="note" id="ios-note">After installing, open Pulse and it will offer to finish pairing.</p>
    </div>

    <div id="desktop" hidden>
      <div class="qr" id="qr" hidden></div>
      <div class="actions">
        <a class="badge" href="https://apps.apple.com/app/id6748621024"><img src="assets/badge-app-store.svg" alt="Download on the App Store"></a>
        <a class="badge" href="https://play.google.com/store/apps/details?id=com.mieweb.pulse"><img src="assets/badge-google-play.png" alt="Get it on Google Play"></a>
      </div>
    </div>

    <!-- Test host only: what the page read from the link. Never shows the token itself. -->
    <div class="debug" id="debug"></div>
  </main>

  <script>
    (function () {
      var PACKAGE = 'com.mieweb.pulse';
      var APP_STORE = 'https://apps.apple.com/app/id6748621024';

      // Everything after '#' — browsers never send it to GitHub.
      var fragment = location.hash.replace(/^#/, '');
      var params = new URLSearchParams(fragment);
      var hasPairing = !!(params.get('artifactId') && params.get('server'));

      var appLink = 'pulsecam://?' + fragment;
      var referrer = hasPairing ? '&referrer=' + encodeURIComponent(fragment) : '';
      var playApp = 'market://details?id=' + PACKAGE + referrer;

      var ua = navigator.userAgent;
      var isIOS = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
      var isAndroid = /Android/.test(ua);

      var $ = function (id) { return document.getElementById(id); };
      var serverHost = '';
      try { serverHost = new URL(params.get('server')).host; } catch (e) {}

      if (hasPairing && serverHost) {
        $('lead').textContent = 'Get Pulse to pair with ' + serverHost + ' and upload your video.';
      } else if (fragment) {
        $('lead').textContent = 'This link is missing its pairing details. Ask for a new one.';
      }

      if (isAndroid) {
        $('android').hidden = false;
        $('play-badge').href = playApp;
        $('android-open').href = appLink;
        $('title').textContent = 'Get Pulse';
        // Reaching this page means Pulse isn't installed (or Android didn't open it), so go
        // straight to Play — once per visit: coming back to this tab must not bounce again.
        if (hasPairing && !(history.state && history.state.sentToStore)) {
          history.replaceState({ sentToStore: true }, '');
          location.href = playApp;
        }
      } else if (isIOS) {
        $('ios').hidden = false;
        $('ios-open').href = appLink;
        $('title').textContent = 'Get Pulse';
        if (!hasPairing) $('ios-note').hidden = true;
        $('get-pulse').addEventListener('click', function () {
          var go = function () { location.href = APP_STORE; };
          if (!hasPairing || !navigator.clipboard) return go();
          // The copied link is what carries the pairing through the install: on first
          // launch Pulse sees a URL on the pasteboard and offers to finish pairing.
          navigator.clipboard.writeText(location.href).then(go, go);
        });
      } else {
        $('desktop').hidden = false;
        $('title').textContent = 'Open this on your phone';
        $('lead').textContent = 'Scan this code with your phone’s camera to open it in Pulse.';
        var script = document.createElement('script');
        script.src = 'https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js';
        script.onload = function () {
          var qr = qrcode(0, 'M');
          qr.addData(location.href);
          qr.make();
          $('qr').innerHTML = qr.createImgTag(6, 0);
          $('qr').hidden = false;
        };
        document.head.appendChild(script);
      }

      $('debug').textContent =
        'TEST HOST · ' + (isAndroid ? 'android' : isIOS ? 'ios' : 'desktop') +
        ' · server: ' + (serverHost || '—') +
        ' · artifactId: ' + (params.get('artifactId') ? 'yes' : 'no') +
        ' · token: ' + (params.get('token') ? 'yes' : 'no') +
        ' · fragment: ' + fragment.length + ' chars' +
        ' · referrer: ' + encodeURIComponent(fragment).length + ' chars';
    })();
  </script>
</body>
</html>
